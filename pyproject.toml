[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env = [
    "APP_ENV=test",
    "DATABASE_URL=postgresql+asyncpg://postgres:password@localhost:5432/football_alerts_test",
    "DATABASE_URL_SYNC=postgresql://postgres:password@localhost:5432/football_alerts_test",
    "REDIS_URL=redis://localhost:6379/1",
    "SECRET_KEY=test-secret-key-not-for-production",
    "ADMIN_KEY=test-admin-key",
    "FOOTBALL_DATA_API_KEY=test",
    "RESEND_API_KEY=test",
    "EMAIL_FROM=test@test.com",
    "FRONTEND_URL=http://localhost:5173",
]