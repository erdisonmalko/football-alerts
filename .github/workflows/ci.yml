name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── LINT ─────────────────────────────────────────────────────────────────────
  # Runs on every push to every branch
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

  # ── UNIT TESTS ────────────────────────────────────────────────────────────────
  # Runs on every push to every branch
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/v1/test_unit_alerts.py -v

  # ── INTEGRATION TESTS ─────────────────────────────────────────────────────────
  # Only runs on PRs to main OR direct pushes to main
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: football_alerts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Alembic migrations on test DB
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key
          ADMIN_KEY: ci-test-admin-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/football_alerts_test
          DATABASE_URL_SYNC: postgresql://postgres:password@localhost:5432/football_alerts_test

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key
          ADMIN_KEY: ci-test-admin-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/football_alerts_test
          DATABASE_URL_SYNC: postgresql://postgres:password@localhost:5432/football_alerts_test
