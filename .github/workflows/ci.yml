name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── LINT ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

  # ── UNIT TESTS ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_unit_alerts.py -v

  # ── INTEGRATION TESTS ───────────────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: football_alerts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Alembic migrations on test DB
        env:
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: ci-test-secret-key
          ADMIN_KEY: ci-test-admin-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/football_alerts_test
          DATABASE_URL_SYNC: postgresql://postgres:password@localhost:5432/football_alerts_test
        run: alembic upgrade head

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: ci-test-secret-key
          ADMIN_KEY: ci-test-admin-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/football_alerts_test
          DATABASE_URL_SYNC: postgresql://postgres:password@localhost:5432/football_alerts_test
        run: pytest tests/integration/ -v

  # ── DEPLOY ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only deploy when merging/pushing to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach